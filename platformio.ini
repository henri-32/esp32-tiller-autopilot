; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericSTM32F411RE

[env]
build_flags = -std=gnu++17

[env:genericSTM32F411RE]
platform = ststm32
board = genericSTM32F411RE
framework = stm32cube
build_flags =
    ${env.build_flags}

[env:native_csc]
; test-only environment (use: pio test -e native_csc)
; running "pio run -e native_csc" is expected to fail (no program main)
platform = native
build_type = debug
test_framework = unity
test_build_src = true
build_flags =
    ${env.build_flags}
build_src_filter =
    +<core/steering/csc/>

[env:sim]
; simulation environment (builds only sim/)
platform = native
build_type = debug
build_flags =
    ${env.build_flags}
    -Isim
    -Iinclude
build_src_filter =
    -<*>
    +<../sim/headingSimulator.cpp>
    +<core/steering/csc/>
