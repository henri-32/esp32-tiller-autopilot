; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericSTM32F411RE

[env]
build_flags = -std=gnu++17

[env:genericSTM32F411RE]
platform = ststm32
board = genericSTM32F411RE
framework = stm32cube
build_flags =
    ${env.build_flags}
build_src_filter = 
    -<core/gui_main.cpp> 

[env:native_csc]
; test-only environment (use: pio test -e native_csc)
; running "pio run -e native_csc" is expected to fail (no program main)
platform = native
build_type = debug
test_framework = unity
test_build_src = true
build_flags =
    ${env.build_flags}
build_src_filter =
    +<core/steering/csc/>

[env:sim]
; simulation environment (builds only sim/)
platform = native
build_type = debug
build_flags =
    ${env.build_flags}
    -Isim
    -Iinclude
build_src_filter =
    -<*>
    +<../sim/headingSimulator.cpp>
    +<core/steering/csc/>

[env:gui]
platform = native
build_type = debug
build_flags =
    ${env.build_flags}
    -DGUI_ENABLE_SIM=0
build_src_filter =
    ; Build only GUI-native relevant sources (stable whitelist)
    -<*>
    +<core/gui_main.cpp>
    +<core/systemController.cpp>
    +<core/steering/>
    +<diagnostics/>
    +<sensors/>
    +<actuators/pwmController.cpp>
    +<ui/controlPanel.cpp>
    +<ui/display.cpp>

[env:gui_sim]
; optional extension for later simulation integration into the GUI
platform = native
build_type = debug
build_flags =
    ${env.build_flags}
    -DGUI_ENABLE_SIM=1
    -DHEADING_SIM_NO_MAIN
    -Isim
build_src_filter =
    ; same GUI core + simulation engine
    -<*>
    +<core/gui_main.cpp>
    +<core/systemController.cpp>
    +<core/steering/>
    +<diagnostics/>
    +<sensors/>
    +<actuators/pwmController.cpp>
    +<ui/controlPanel.cpp>
    +<ui/display.cpp>
    +<../sim/headingSimulator.cpp>
